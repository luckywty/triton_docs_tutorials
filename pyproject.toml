[project]
name = "triton-docs-tutorials"
version = "0.1.0"
description = "PyTorch and Triton GPU tutorial environment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "notebook>=7.6.3",
    "numpy>=2.2,<3",
    "pandas>=3.0.6",
    "tabulate>=0.10.0",
    "torch==2.9.1",
    "triton==3.5.1",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
